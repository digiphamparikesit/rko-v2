<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug Admin</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f4f7f4; }
    .error { color: #dc5b45; background: #fbEAe7; padding: 15px; border-radius: 8px; border: 1px solid #dc5b45; margin: 10px 0; }
    .success { color: #16a34a; background: #e7f5ec; padding: 15px; border-radius: 8px; border: 1px solid #16a34a; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 8px; overflow: hidden; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: #0f3d2e; color: white; }
    pre { background: #f1f1f1; padding: 10px; border-radius: 5px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>🔍 Debug Master Barang</h1>
  <div id="status">Memuat...</div>
  <div id="dataDisplay"></div>

  <script>
    // === KONFIGURASI ===
    const SUPABASE_URL = 'https://ghdsegrmnkcbjcegsevj.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdoZHNlZ3Jtbm5rYmNqY2Vnc2V2aiIsInJvbGUiOiJzZXJ2aWNlX3JvbGUiLCJpYXQiOjE3MjU4MTU5NjksImV4cCI6MjA0MTM5MTk2OX0.9P0a7x4QpIYqTsRnZqjTfPwQ5zDc2JwKjLmNnOpQrStU'; // GANTI DENGAN SERVICE ROLE KEY ASLI

    const status = document.getElementById('status');
    const display = document.getElementById('dataDisplay');

    // Coba dengan fetch langsung (tanpa library supabase-js)
    async function testFetch() {
      status.textContent = '⏳ Mengambil data dengan fetch...';
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/master_barang?select=*`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });

        const data = await response.json();
        console.log('Response:', response);
        console.log('Data:', data);

        if (!response.ok) {
          status.innerHTML = `<div class="error">❌ HTTP Error ${response.status}: ${response.statusText}</div>`;
          display.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
          return;
        }

        if (!data || data.length === 0) {
          status.innerHTML = `<div class="error">⚠️ Tabel master_barang kosong (0 baris).</div>`;
          display.innerHTML = `<div class="info">Belum ada data.</div>`;
          return;
        }

        status.innerHTML = `<div class="success">✅ Berhasil memuat ${data.length} barang.</div>`;
        let html = '<table><thead><tr>';
        const columns = Object.keys(data[0]);
        columns.forEach(col => html += `<th>${col}</th>`);
        html += '</tr></thead><tbody>';
        data.forEach(row => {
          html += '<tr>';
          columns.forEach(col => {
            const val = row[col] !== null ? row[col] : '-';
            html += `<td>${val}</td>`;
          });
          html += '</tr>';
        });
        html += '</tbody></table>';
        display.innerHTML = html;

      } catch (err) {
        status.innerHTML = `<div class="error">❌ Exception: ${err.message}</div>`;
        display.innerHTML = `<pre>${err.stack}</pre>`;
      }
    }

    // Jalankan
    testFetch();
  </script>
</body>
</html>
