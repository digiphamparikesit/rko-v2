<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Debug</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial; padding: 20px; }
    .error { color: red; background: #ffe0e0; padding: 15px; border-radius: 8px; }
    .success { color: green; background: #e0ffe0; padding: 15px; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #0f3d2e; color: white; }
  </style>
</head>
<body>
  <h1>Debug Master Barang</h1>
  <div id="status">Memuat...</div>
  <div id="dataDisplay"></div>

  <script>
    const SUPABASE_URL = 'https://ghdsegrmnkcbjcegsevj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_fXjaAI4FYxC5etIhEGF5LA_CLV7u0NN';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function testQuery() {
      const status = document.getElementById('status');
      const display = document.getElementById('dataDisplay');

      try {
        status.textContent = 'Mengambil data...';
        const { data, error, status: httpStatus } = await supabase
          .from('master_barang')
          .select('*');

        if (error) {
          status.innerHTML = `<span class="error">❌ Error: ${error.message} (${error.code})</span>`;
          display.innerHTML = `<pre>${JSON.stringify(error, null, 2)}</pre>`;
          return;
        }

        if (!data || data.length === 0) {
          status.innerHTML = `<span class="error">⚠️ Tidak ada data di master_barang</span>`;
          display.innerHTML = '';
          return;
        }

        status.innerHTML = `<span class="success">✅ Berhasil memuat ${data.length} barang</span>`;

        let html = '<table><thead><tr>';
        const columns = Object.keys(data[0]);
        columns.forEach(col => html += `<th>${col}</th>`);
        html += '</tr></thead><tbody>';
        data.forEach(row => {
          html += '<tr>';
          columns.forEach(col => {
            html += `<td>${row[col] !== null ? row[col] : '-'}</td>`;
          });
          html += '</tr>';
        });
        html += '</tbody></table>';
        display.innerHTML = html;

      } catch (err) {
        status.innerHTML = `<span class="error">❌ Exception: ${err.message}</span>`;
        display.innerHTML = `<pre>${err.stack}</pre>`;
      }
    }

    testQuery();
  </script>
</body>
</html>
