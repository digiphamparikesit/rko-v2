  // ============================================================
  //  UTILITY
  // ============================================================
  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, s => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[s]));
  }

  // ============================================================
  //  RENDER MENU
  // ============================================================
  function renderMenu() {
    const role = window.currentUser.role;
    const container = document.getElementById('menuContainer');
    let html = '';
    let totalDitampilkan = 0;

    MENU_GROUPS.forEach(group => {
      const items = group.items.filter(it => it.roles.includes(role));
      if (items.length === 0) return;

      html += `<div class="section-title">${group.title}</div><div class="menu-grid">`;
      items.forEach(it => {
        totalDitampilkan++;
        const disabled = !it.ready;
        const cls = [
          'menu-card',
          it.color || '',
          disabled ? 'disabled' : ''
        ].filter(Boolean).join(' ');

        const badge = disabled ? '<span class="menu-badge">Segera</span>' : '';

        if (disabled) {
          html += `
            <div class="${cls}" onclick="window.klikBelumTersedia('${escapeHtml(it.name)}')">
              ${badge}
              <div class="menu-icon">${it.icon}</div>
              <div class="menu-text">
                <div class="name">${escapeHtml(it.name)}</div>
                <div class="desc">${escapeHtml(it.desc)}</div>
              </div>
            </div>`;
        } else {
          html += `
            <a class="${cls}" href="${it.url}">
              <div class="menu-icon">${it.icon}</div>
              <div class="menu-text">
                <div class="name">${escapeHtml(it.name)}</div>
                <div class="desc">${escapeHtml(it.desc)}</div>
              </div>
            </a>`;
        }
      });
      html += '</div>';
    });

    if (totalDitampilkan === 0) {
      container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted);">Role Anda tidak memiliki akses ke menu apa pun. Hubungi admin.</div>';
    } else {
      container.innerHTML = html;
    }
  }

  window.klikBelumTersedia = function(nama) {
    alert('Menu "' + nama + '" sedang dalam pengembangan.');
  };

  // ============================================================
  //  LOGOUT
  // ============================================================
  window.logout = async function() {
    if (!confirm('Keluar dari aplikasi?')) return;
    try {
      await window.supabase.auth.signOut();
    } catch (e) {
      console.warn('Sign out gagal:', e);
    }
    try { sessionStorage.removeItem('rko_user'); } catch (e) {}
    window.location.href = 'login.html';
  };

  // ============================================================
  //  SESSION CHECK & INIT
  // ============================================================
  (async function init() {
    // 1. Cek Supabase Auth
    let session = null;
    try {
      const res = await window.supabase.auth.getSession();
      session = res.data.session;
    } catch (e) {
      console.warn('Cek session gagal:', e);
    }

    if (!session) {
      window.location.href = 'login.html';
      return;
    }

    // 2. Ambil profil dari sessionStorage
    let user = null;
    try {
      const stored = sessionStorage.getItem('rko_user');
      if (stored) user = JSON.parse(stored);
    } catch (e) {}

    // Kalau profil hilang, ambil ulang dari DB
    if (!user || !user.role) {
      try {
        const email = session.user.email;
        const { data, error } = await window.supabase
          .from('users')
          .select('*')
          .eq('email', email)
          .limit(1);
        if (error) throw error;
        const profil = data && data[0];
        if (!profil) {
          await window.supabase.auth.signOut();
          window.location.href = 'login.html';
          return;
        }
        user = {
          id: profil.id,
          auth_id: session.user.id,
          email: profil.email,
          nama: profil.nama,
          role: profil.role,
          ruangan_id: profil.ruangan_id || null,
          active: profil.active !== false
        };
        sessionStorage.setItem('rko_user', JSON.stringify(user));
      } catch (e) {
        console.error('Gagal ambil profil:', e);
        window.location.href = 'login.html';
        return;
      }
    }

    // 3. Set user global dan tampilkan UI
    window.currentUser = user;
    const roleLabel = String(user.role).replace(/_/g, ' ');
    document.getElementById('whoLabel').textContent = user.nama + ' · ' + roleLabel;
    document.getElementById('greeting').textContent = 'Selamat datang, ' + user.nama;
    document.getElementById('welcomeSub').textContent = 'Pilih menu di bawah untuk memulai.';
    document.getElementById('roleTag').textContent = roleLabel;

    // 4. Render menu sesuai role
    renderMenu();
  })();
