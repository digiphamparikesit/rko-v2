<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RKO RSAMP</title>
  <style>
    /* GAYA DASAR */
    :root {
      --green-deep: #0F3D2E;
      --green-mid: #16A34A;
      --green-bright: #3FCF6A;
      --bg: #F4F7F4;
      --card: #FFFFFF;
      --text-dark: #14201A;
      --text-muted: #6B7A72;
      --border: #E4EAE5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      display: flex;
    }
    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background: var(--green-deep);
      color: #fff;
      min-height: 100vh;
      padding: 24px 0;
      position: sticky;
      top: 0;
      align-self: flex-start;
    }
    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      margin-bottom: 12px;
    }
    .sidebar-logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--green-bright);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--green-deep);
      font-size: 15px;
    }
    .sidebar-title {
      font-weight: 700;
      font-size: 15px;
      line-height: 1.3;
    }
    .sidebar-sub {
      font-size: 11px;
      color: rgba(255,255,255,0.6);
    }
    .menu-list {
      display: flex;
      flex-direction: column;
      padding: 4px 10px;
      gap: 2px;
    }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      color: rgba(255,255,255,0.82);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      transition: background 0.15s ease;
    }
    .menu-item:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }
    .menu-icon {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: rgba(255,255,255,0.15);
    }
    .menu-icon svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: #fff;
      stroke-width: 2;
    }
    .sidebar-footer {
      padding: 16px 20px 0;
      margin-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.12);
      font-size: 11px;
      color: rgba(255,255,255,0.55);
    }
    .main-content {
      flex: 1;
      padding: 40px 44px;
    }
    .welcome-heading h1 {
      font-size: 23px;
      margin: 0 0 4px;
      color: var(--text-dark);
    }
    .welcome-heading p {
      margin: 0;
      color: var(--text-muted);
      font-size: 13.5px;
    }
    @media (max-width: 860px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: -280px;
        width: 260px;
        height: 100vh;
        z-index: 160;
        transition: left 0.2s ease;
      }
      .sidebar.open { left: 0; }
      .main-content { padding: 24px 20px; }
    }
  </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">RS</div>
    <div>
      <div class="sidebar-title">RKO RSAMP</div>
      <div class="sidebar-sub">Efisiensi TujuanKU</div>
    </div>
  </div>
  <nav class="menu-list">
    <a class="menu-item" href="dashboard.html">
      <div class="menu-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg></div>
      Dashboard RKO
    </a>
    <a class="menu-item" href="admin.html">
      <div class="menu-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg></div>
      Admin
    </a>
    <a class="menu-item" href="user.html">
      <div class="menu-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg></div>
      User
    </a>
    <a class="menu-item" href="gudang-farmasi.html">
      <div class="menu-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg></div>
      Gudang Farmasi
    </a>
    <a class="menu-item" href="distributor.html">
      <div class="menu-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg></div>
      Distributor
    </a>
    <a class="menu-item" href="laporan.html">
      <div class="menu-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg></div>
      Laporan
    </a>
    <a class="menu-item" href="keuangan.html">
      <div class="menu-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg></div>
      Keuangan
    </a>
    <a class="menu-item" href="pembelian.html">
      <div class="menu-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg></div>
      Pembelian
    </a>
    <a class="menu-item" href="penerimaan.html">
      <div class="menu-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg></div>
      Penerimaan Barang
    </a>
    <a class="menu-item" href="penjualan.html">
      <div class="menu-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg></div>
      Penjualan
    </a>
  </nav>
  <div class="sidebar-footer">RKO Obat &amp; BMHP · RS AM Parikesit</div>
</aside>

<!-- MAIN CONTENT -->
<div style="flex:1;">
  <main class="main-content">
    <div class="welcome-heading">
      <h1>Selamat datang, Super Admin</h1>
      <p>Pilih menu di sisi kiri untuk mulai.</p>
    </div>
  </main>
</div>

</body>
</html>
