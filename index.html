  <style>
    /* ==== CSS khusus index.html — layout sidebar ==== */
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--text-dark); }

    .app-layout { display: flex; min-height: 100vh; }

    /* ============ SIDEBAR ============ */
    .sidebar {
      width: 260px;
      background: var(--green-deep);
      color: #fff;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 50;
      transition: transform 0.25s ease;
    }

    .sidebar-brand {
      padding: 20px 20px 18px;
      display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
    }
    .sidebar-brand .mark {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: var(--green-bright);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 15px; color: var(--green-deep);
      flex-shrink: 0;
    }
    .sidebar-brand .title { font-weight: 700; font-size: 15px; line-height: 1.2; }
    .sidebar-brand .sub { font-size: 11px; color: rgba(255,255,255,0.55); line-height: 1.2; margin-top: 2px; }

    .sidebar-menu {
      flex: 1;
      overflow-y: auto;
      padding: 10px 0 20px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.15) transparent;
    }
    .sidebar-menu::-webkit-scrollbar { width: 6px; }
    .sidebar-menu::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

    .sidebar-section { margin-bottom: 2px; }

    .sidebar-section-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 11px 20px;
      font-size: 10.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.9px;
      color: rgba(255,255,255,0.45);
      background: none; border: none; width: 100%;
      cursor: pointer; font-family: inherit; text-align: left;
      transition: color 0.15s;
    }
    .sidebar-section-header:hover { color: rgba(255,255,255,0.85); }
    .sidebar-section-header .chev {
      font-size: 9px;
      transition: transform 0.2s;
      color: rgba(255,255,255,0.4);
    }
    .sidebar-section.collapsed .sidebar-section-header .chev { transform: rotate(-90deg); }
    .sidebar-section.collapsed .sidebar-items { display: none; }

    .sidebar-items {
      display: flex; flex-direction: column;
      padding: 2px 0 6px;
    }

    .sidebar-item {
      display: flex; align-items: center; gap: 12px;
      padding: 9px 20px 9px 22px;
      color: rgba(255,255,255,0.82);
      text-decoration: none;
      font-size: 13.5px;
      line-height: 1.3;
      border-left: 3px solid transparent;
      transition: all 0.15s;
      cursor: pointer;
    }
    .sidebar-item:hover {
      background: rgba(255,255,255,0.06);
      color: #fff;
      border-left-color: rgba(255,255,255,0.2);
    }
    .sidebar-item.disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .sidebar-item.disabled:hover {
      background: transparent;
      border-left-color: transparent;
      color: rgba(255,255,255,0.82);
    }

    .sidebar-item .icon {
      width: 20px;
      font-size: 15px;
      text-align: center;
      flex-shrink: 0;
    }
    .sidebar-item .sidebar-badge {
      background: #DC5B45;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      min-width: 20px;
      text-align: center;
      line-height: 1.3;
      flex-shrink: 0;
    }

    .sidebar-footer {

    }

      .main-content { margin-left: 0; }

  </style>

  // ============================================================
  //  UTILITY
  // ============================================================
  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, s => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[s]));
  }

  // ============================================================
  //  TOGGLE SIDEBAR (MOBILE)
  // ============================================================
  window.toggleSidebar = function() {
    const sb = document.getElementById('sidebar');
    const bd = document.getElementById('sidebarBackdrop');
    sb.classList.toggle('open');
    bd.classList.toggle('show');
  };

  // ============================================================
  //  RENDER SIDEBAR MENU
  // ============================================================
  function renderSidebarMenu() {
    const role = window.currentUser.role;
    const container = document.getElementById('sidebarMenu');
    let html = '';
    let totalItems = 0;

    // Section terbuka secara default: hanya yang paling atas
    let firstOpened = false;

    MENU_GROUPS.forEach((group, groupIdx) => {
      const items = group.items.filter(it => it.roles.includes(role));
      if (items.length === 0) return;

      const openByDefault = !firstOpened;
      if (!firstOpened) firstOpened = true;

      const sectionCls = 'sidebar-section' + (openByDefault ? '' : ' collapsed');

      html += `<div class="${sectionCls}" data-section="${groupIdx}">`;
      html += `<button class="sidebar-section-header" onclick="window.toggleSection(${groupIdx})">`;
      html += `<span>${escapeHtml(group.title)}</span>`;
      html += `<span class="chev">▼</span>`;
      html += `</button>`;
      html += `<div class="sidebar-items">`;

      items.forEach(it => {
        totalItems++;
        const disabled = !it.ready;
        const cls = 'sidebar-item' + (disabled ? ' disabled' : '');
        const title = escapeHtml(it.desc || '');

        if (disabled) {
          html += `<div class="${cls}" title="${title}" onclick="window.klikBelumTersedia('${escapeHtml(it.name)}')">
            <span class="icon">${it.icon}</span>
            <span class="label">${escapeHtml(it.name)}</span>
          </div>`;
        } else {
          html += `<a class="${cls}" href="${it.url}" title="${title}">
            <span class="icon">${it.icon}</span>
            <span class="label">${escapeHtml(it.name)}</span>
          </a>`;
        }
      });

      html += `</div></div>`;
    });

    if (totalItems === 0) {
      container.innerHTML = '<div style="padding:20px; text-align:center; color:rgba(255,255,255,0.6); font-size:12.5px;">Role Anda tidak memiliki akses ke menu apa pun.</div>';
    } else {
      container.innerHTML = html;
    }
  }

  window.toggleSection = function(groupIdx) {
    const el = document.querySelector(`.sidebar-section[data-section="${groupIdx}"]`);
    if (el) el.classList.toggle('collapsed');
  };

  window.klikBelumTersedia = function(nama) {
    alert('Menu "' + nama + '" sedang dalam pengembangan.');
  };

  // ============================================================
  //  RENDER AKSI CEPAT
  // ============================================================
  function renderQuickActions() {
    const role = window.currentUser.role;
    const grid = document.getElementById('quickGrid');

    // Menu yang dianggap "sering dipakai"
    const quickPriority = [
      'dashboard.html', 'usulan-pembelian.html', 'monitoring-rko.html',
      'user.html', 'pembelian.html', 'penerimaan.html',
      'mutasi-barang.html', 'laporan.html'
    ];

    // Ambil semua item yang role-nya cocok
    let allItems = [];
    MENU_GROUPS.forEach(group => {
      group.items.forEach(it => {
        if (it.roles.includes(role) && it.ready) allItems.push(it);
      });
    });

    // Urutkan sesuai prioritas
    allItems.sort((a, b) => {
      const ia = quickPriority.indexOf(a.url);
      const ib = quickPriority.indexOf(b.url);
      if (ia === -1 && ib === -1) return 0;
      if (ia === -1) return 1;
      if (ib === -1) return -1;
      return ia - ib;
    });

    // Ambil maksimum 6
    const top = allItems.slice(0, 6);

    if (top.length === 0) {
      grid.innerHTML = '<div style="color:var(--text-muted); font-size:13px;">Tidak ada aksi cepat untuk role Anda.</div>';
      return;
    }

    grid.innerHTML = top.map(it => {
      const colorCls = it.color || '';
      return `<a class="quick-card ${colorCls}" href="${it.url}">
        <div class="q-icon">${it.icon}</div>
        <div class="q-text">
          <div class="q-name">${escapeHtml(it.name)}</div>
          <div class="q-desc">${escapeHtml(it.desc || '')}</div>
        </div>
      </a>`;
    }).join('');
  }

  // ============================================================
  //  LOGOUT
  // ============================================================
  window.logout = async function() {
    if (!confirm('Keluar dari aplikasi?')) return;
    try {
      await window.supabase.auth.signOut();
    } catch (e) {
      console.warn('Sign out gagal:', e);
    }
    try { sessionStorage.removeItem('rko_user'); } catch (e) {}
    window.location.href = 'login.html';
  };

  // ============================================================
  //  SESSION CHECK & INIT
  // ============================================================
  (async function init() {
    let session = null;
    try {
      const res = await window.supabase.auth.getSession();
      session = res.data.session;
    } catch (e) {
      console.warn('Cek session gagal:', e);
    }

    if (!session) {
      window.location.href = 'login.html';
      return;
    }

    let user = null;
    try {
      const stored = sessionStorage.getItem('rko_user');
      if (stored) user = JSON.parse(stored);
    } catch (e) {}

    if (!user || !user.role) {
      try {
        const email = session.user.email;
        const { data, error } = await window.supabase
          .from('users')
          .select('*')
          .eq('email', email)
          .limit(1);
        if (error) throw error;
        const profil = data && data[0];
        if (!profil) {
          await window.supabase.auth.signOut();
          window.location.href = 'login.html';
          return;
        }
        user = {
          id: profil.id,
          auth_id: session.user.id,
          email: profil.email,
          nama: profil.nama,
          role: profil.role,
          ruangan_id: profil.ruangan_id || null,
          active: profil.active !== false
        };
        sessionStorage.setItem('rko_user', JSON.stringify(user));
      } catch (e) {
        console.error('Gagal ambil profil:', e);
        window.location.href = 'login.html';
        return;
      }
    }

    window.currentUser = user;
    const roleLabel = String(user.role).replace(/_/g, ' ');
    document.getElementById('greeting').textContent = 'Selamat datang, ' + user.nama;
    document.getElementById('welcomeSub').textContent = 'Pilih menu di sidebar kiri atau aksi cepat di bawah.';
    document.getElementById('userName').textContent = user.nama;
    document.getElementById('roleTag').textContent = roleLabel;

    renderSidebarMenu();
    renderQuickActions();
    renderSidebarBadges();
  })();

  // ============================================================
  //  BADGE DI SIDEBAR — usulan + approval pending
  // ============================================================
  async function renderSidebarBadges() {
    const role = window.currentUser && window.currentUser.role;
    const NOTIF_ALLOW_ROLES = ['SUPER_ADMIN', 'ADMIN', 'KOORDINATOR_LOGISTIK_FARMASI', 'KEPALA_INSTALASI_FARMASI'];
    if (!role || !NOTIF_ALLOW_ROLES.includes(role)) return;

    try {
      const counts = await window.auth.fetchNotifCounts();
      if (!counts) return;

      updateSidebarBadge('usulan-pembelian.html', counts.usulan);
      updateSidebarBadge('approval.html', counts.approval);
    } catch (err) {
      console.warn('[NOTIF] fetch gagal:', err);
    }
  }

  function updateSidebarBadge(url, count) {
    const items = document.querySelectorAll('.sidebar-item');
    let found = false;
    items.forEach(item => {
      if (item.getAttribute('href') === url) {
        found = true;
        // Hapus badge lama
        const oldBadge = item.querySelector('.sidebar-badge');
        if (oldBadge) oldBadge.remove();
        // Tambah badge kalau count > 0
        if (count > 0) {
          const badge = document.createElement('span');
          badge.className = 'sidebar-badge';
          badge.textContent = count > 99 ? '99+' : count;
          item.appendChild(badge);
        }
      }
    });
  }
</script>
</body>
