<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembelian — RKO RSAMP</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    /* ===== GAYA DASAR (sama seperti sebelumnya) ===== */
    :root {
      --green-deep: #0F3D2E; --green-mid: #16A34A; --green-bright: #3FCF6A;
      --green-soft: #E7F5EC; --bg: #F4F7F4; --card: #FFFFFF;
      --text-dark: #14201A; --text-muted: #6B7A72;
      --amber: #D97706; --coral: #DC5B45; --border: #E4EAE5;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--text-dark); }

    header.topbar {
      position: sticky; top: 0; z-index: 100;
      background: var(--green-deep); color: #fff; padding: 18px 24px;
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand .mark { width: 34px; height: 34px; border-radius: 9px; background: var(--green-bright); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: var(--green-deep); }
    .brand .label { font-size: 12px; color: rgba(255,255,255,0.65); line-height: 1.2; }
    .brand .title { font-weight: 700; font-size: 15px; line-height: 1.2; }
    .topbar-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .who { font-size: 12.5px; color: rgba(255,255,255,0.85); }
    a.back { color: rgba(255,255,255,0.85); text-decoration: none; font-size: 13px; }
    a.back:hover { color: #fff; }
    .topbar select { background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; padding: 7px 10px; font-size: 13px; font-family: inherit; }
    select option { color: #14201A; }

    main { max-width: 100%; margin: 0; padding: 24px 20px 60px; }
    .layout-split { display: grid; grid-template-columns: 1fr 2fr; gap: 16px; align-items: start; }
    .left-col { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 90px; }
    .side-panel { padding: 18px 20px; }
    .side-title { font-size: 14px; margin: 0 0 12px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 11.5px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; }
    .field select, .field input { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; }
    @media (max-width: 860px) { .layout-split { grid-template-columns: 1fr; } .left-col { position: static; } }

    .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    .toolbar input[type="text"] { flex: 1; min-width: 220px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 9px; font-size: 13.5px; }

    .btn { padding: 10px 16px; border: none; border-radius: 9px; font-weight: 600; font-size: 13.5px; cursor: pointer; }
    .btn-primary { background: var(--green-mid); color: #fff; }
    .btn-primary:hover { background: #128a3e; }
    .btn-secondary { background: #F1F1EE; color: var(--text-dark); }
    .btn-warning { background: var(--amber); color: #fff; }
    .btn-warning:hover { background: #B45309; }
    .btn-sm { padding: 4px 10px; font-size: 11px; border-radius: 6px; }

    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 900px; }
    th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { color: var(--text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.3px; background: #FAFBFA; }
    td.num { text-align: right; }

    .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
    .badge.draft { background: #F1F1EE; color: var(--text-muted); }
    .badge.dikirim { background: #FDF1E0; color: var(--amber); }
    .badge.sebagian { background: #FBEAE7; color: var(--coral); }
    .badge.selesai { background: var(--green-soft); color: var(--green-mid); }

    select.status-select { padding: 5px 8px; border: 1px solid var(--border); border-radius: 7px; font-size: 12px; }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13.5px; }

    /* MODAL */
    #modalOverlay, #modalUpload {
      display: none; position: fixed; inset: 0; background: rgba(15,61,46,0.45);
      align-items: center; justify-content: center; z-index: 40; padding: 20px;
    }
    #modalOverlay.show, #modalUpload.show { display: flex; }
    .modal { background: #fff; border-radius: 16px; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; padding: 26px; }
    .modal h2 { font-size: 16px; margin: 0 0 16px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 5px; color: var(--text-muted); }
    .field input, .field select { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; font-size: 13.5px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    .form-msg { font-size: 12.5px; color: var(--coral); min-height: 16px; margin-top: 6px; }
  </style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="mark">RS</div>
    <div><div class="title">RKO RSAMP</div><div class="label">Pembelian — buat &amp; kelola PO</div></div>
  </div>
  <div class="topbar-right">
    <span class="who" id="whoLabel"></span>
    <select id="bulanSelect"></select>
    <select id="tahunSelect"></select>
    <a class="back" href="index.html">&#8592; Menu utama</a>
  </div>
</header>

<main>
  <div class="layout-split">
    <aside class="left-col">
      <div class="panel side-panel">
        <h2 class="side-title">Cari &amp; Filter</h2>
        <div class="field"><label>Cari nama barang / no. PO</label><input type="text" id="searchBox" placeholder="Cari nama barang atau no. PO..."></div>
        <div class="field"><label>Golongan</label><select id="filterGolongan"><option value="">Semua golongan</option><option value="OBAT">Obat</option><option value="BMHP">BMHP</option><option value="BHP">BHP</option><option value="B3">B3</option><option value="NUTRISI ENTERAL">Nutrisi Enteral</option><option value="PROGRAM">Program</option><option value="PROGRAM TB">Program TB</option><option value="PROGRAM HIV">Program HIV</option><option value="PROGRAM MALARIA">Program Malaria</option><option value="PROGRAM RABIES">Program Rabies</option><option value="PROGRAM BKKBN">Program BKKBN</option><option value="PROGRAM COVID">Program Covid</option><option value="PROGRAM STUNTING">Program Stunting</option><option value="PROGRAM IMUNISASI">Program Imunisasi</option></select></div>
        <div class="field"><label>Status PO</label><select id="filterStatus"><option value="">Semua status</option><option value="DRAFT">Draft</option><option value="DIKIRIM">Dikirim</option><option value="DITERIMA_SEBAGIAN">Diterima sebagian</option><option value="SELESAI">Selesai</option></select></div>
        <button class="btn btn-primary" style="width:100%;" onclick="openForm()">+ Buat PO Baru</button>
        <button class="btn" style="width:100%; margin-top:8px; background:#F1F1EE; color:var(--text-dark);" onclick="openUploadModal()">&#8593; Upload Data dari SIM RS (CSV)</button>
      </div>
    </aside>
    <section class="right-col">
      <div class="panel">
        <table>
          <thead><tr><th>No. PO</th><th>Nama barang</th><th>Distributor</th><th class="num">Qty pesan</th><th>Tanggal PO</th><th>Status</th><th>Aksi</th></tr></thead>
          <tbody id="tableBody"><tr><td colspan="7" class="empty-state">Memuat data...</td></tr></tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<!-- MODAL FORM & UPLOAD SAMA SEPERTI SEBELUMNYA -->
<div id="modalOverlay"> ... </div>
<div id="modalUpload"> ... </div>

<script>
  // ============================================================
  //  KONFIGURASI SUPABASE
  // ============================================================
  const SUPABASE_URL = 'https://ghdsegrmnkcbjcegsevj.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdoZHNlZ3JtbmtjYmpjZWdzZXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MTE1MDUsImV4cCI6MjEwNDM4NzUwNX0.q7BtgOzrNR-CfNap0esLg6HEREIGwKLzeNWUdGo9q70';
  window.supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ============================================================
  //  CEK SESSION
  // ============================================================
  const userStr = sessionStorage.getItem('rko_user');
  if (!userStr) window.location.href = 'index.html';
  const currentUser = JSON.parse(userStr);
  if (!['TIM_PEMBELIAN', 'ADMIN', 'SUPER_ADMIN'].includes(currentUser.role)) { alert('Akses ditolak.'); window.location.href = 'index.html'; }
  document.getElementById('whoLabel').textContent = currentUser.nama + ' · ' + currentUser.role;

  // ============================================================
  //  VARIABLES
  // ============================================================
  let barangMap = {}, distributorList = [], rencanaList = [], pembelianList = [], filteredList = [];

  function fillPeriodOptions(curBulan, curTahun) {
    const bulanSel = document.getElementById('bulanSelect');
    const namaBulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    namaBulan.forEach((nm, i) => { const opt = document.createElement('option'); opt.value = i+1; opt.textContent = nm; if (i+1 === curBulan) opt.selected = true; bulanSel.appendChild(opt); });
    const tahunSel = document.getElementById('tahunSelect');
    for (let y = curTahun-1; y <= curTahun+1; y++) { const opt = document.createElement('option'); opt.value = y; opt.textContent = y; if (y === curTahun) opt.selected = true; tahunSel.appendChild(opt); }
  }

  (function init() {
    const now = new Date();
    fillPeriodOptions(now.getMonth()+1, now.getFullYear());
    document.getElementById('bulanSelect').addEventListener('change', loadAllData);
    document.getElementById('tahunSelect').addEventListener('change', loadAllData);
    document.getElementById('searchBox').addEventListener('input', applyFilter);
    document.getElementById('filterGolongan').addEventListener('change', applyFilter);
    document.getElementById('filterStatus').addEventListener('change', applyFilter);
    loadAllData();
  })();

  async function loadAllData() {
    const bulan = document.getElementById('bulanSelect').value;
    const tahun = document.getElementById('tahunSelect').value;
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="7" class="empty-state">Memuat data...</td></tr>';

    try {
      const [barangRes, distRes, rencanaRes, pembelianRes] = await Promise.all([
        window.supabase.from('master_barang').select('*'),
        window.supabase.from('master_distributor').select('*'),
        window.supabase.from('rencana_belanja').select('*').eq('bulan', bulan).eq('tahun', tahun),
        window.supabase.from('pembelian').select('*').eq('bulan', bulan).eq('tahun', tahun)
      ]);
      barangMap = {}; (barangRes.data || []).forEach(b => { barangMap[b.id] = b; });
      distributorList = distRes.data || [];
      rencanaList = rencanaRes.data || [];
      pembelianList = pembelianRes.data || [];
      fillFormOptions();
      applyFilter();
    } catch (err) {
      document.getElementById('tableBody').innerHTML = '<tr><td colspan="7" class="empty-state">Gagal memuat data.</td></tr>';
    }
  }

  function fillFormOptions() { /* sama seperti sebelumnya */ }

  function applyFilter() {
    const q = document.getElementById('searchBox').value.toLowerCase();
    const golongan = document.getElementById('filterGolongan').value;
    const status = document.getElementById('filterStatus').value;
    filteredList = pembelianList.filter(p => {
      const barang = barangMap[p.barang_id];
      const nama = barang ? barang.nama_barang : '';
      const matchQ = !q || nama.toLowerCase().includes(q) || String(p.no_po).toLowerCase().includes(q);
      const matchG = !golongan || (barang && barang.golongan === golongan);
      const matchS = !status || p.status === status;
      return matchQ && matchG && matchS;
    });
    renderTable();
  }

  // ============================================================
  //  RENDER TABEL (DENGAN TOMBOL BUAT ULANG)
  // ============================================================
  function renderTable() {
    const tbody = document.getElementById('tableBody');
    if (filteredList.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Belum ada PO untuk periode ini.</td></tr>';
      return;
    }
    tbody.innerHTML = filteredList.map(p => {
      const barang = barangMap[p.barang_id] || {};
      const dist = distributorList.find(d => d.id === p.distributor_id);
      const statusClass = { DRAFT: 'draft', DIKIRIM: 'dikirim', DITERIMA_SEBAGIAN: 'sebagian', SELESAI: 'selesai' }[p.status] || 'draft';
      const statusLabel = { DRAFT: 'Draft', DIKIRIM: 'Dikirim', DITERIMA_SEBAGIAN: 'Diterima sebagian', SELESAI: 'Selesai' }[p.status] || p.status;

      // Tombol aksi: status DITERIMA_SEBAGIAN → tampilkan tombol Buat Ulang
      let actionBtn = '';
      if (p.status === 'DITERIMA_SEBAGIAN') {
        actionBtn = `<button class="btn btn-warning btn-sm" onclick="buatUlangDariSelisih(${p.id})" title="Buat PO baru untuk selisih">🔄 Buat Ulang</button>`;
      }

      return `<tr>
        <td>${escapeHtml(p.no_po)}</td>
        <td>${escapeHtml(barang.nama_barang || 'Tidak dikenal')}</td>
        <td>${escapeHtml(dist ? dist.nama_distributor : '-')}</td>
        <td class="num">${Number(p.qty_pesan || 0).toLocaleString('id-ID')}</td>
        <td>${escapeHtml(p.tanggal_po || '-')}</td>
        <td><select class="status-select" onchange="updateStatus(${p.id}, this.value)">
          <option value="DRAFT" ${p.status === 'DRAFT' ? 'selected' : ''}>Draft</option>
          <option value="DIKIRIM" ${p.status === 'DIKIRIM' ? 'selected' : ''}>Dikirim</option>
          <option value="DITERIMA_SEBAGIAN" ${p.status === 'DITERIMA_SEBAGIAN' ? 'selected' : ''}>Diterima sebagian</option>
          <option value="SELESAI" ${p.status === 'SELESAI' ? 'selected' : ''}>Selesai</option>
        </select></td>
        <td>${actionBtn}</td>
      </tr>`;
    }).join('');
  }

  // ============================================================
  //  FUNGSI BUAT PO ULANG DARI SELISIH
  // ============================================================
  async function buatUlangDariSelisih(pembelianId) {
    if (!confirm('Buat PO ulang untuk selisih dari PO ini?')) return;
    try {
      // Ambil penerimaan terakhir dengan selisih > 0
      const { data: penerimaan, error: err1 } = await window.supabase
        .from('penerimaan')
        .select('*')
        .eq('pembelian_id', pembelianId)
        .gt('selisih', 0)
        .order('id', { ascending: false })
        .limit(1);
      if (err1) throw err1;
      if (!penerimaan || penerimaan.length === 0) {
        alert('Tidak ada selisih untuk PO ini.');
        return;
      }
      const selisihData = penerimaan[0];
      const qtySelisih = Number(selisihData.selisih);

      // Ambil PO lama
      const { data: poLama, error: err2 } = await window.supabase
        .from('pembelian')
        .select('*')
        .eq('id', pembelianId)
        .single();
      if (err2) throw err2;

      // Buat PO baru
      const now = new Date();
      const bulan = now.getMonth() + 1;
      const tahun = now.getFullYear();
      const noPoBaru = poLama.no_po + '-REV';

      const { error: err3 } = await window.supabase
        .from('pembelian')
        .insert({
          no_po: noPoBaru,
          barang_id: poLama.barang_id,
          distributor_id: poLama.distributor_id,
          bulan: bulan,
          tahun: tahun,
          qty_pesan: qtySelisih,
          satuan_beli: poLama.satuan_beli || '',
          tanggal_po: now.toISOString().slice(0,10),
          status: 'DRAFT'
        });
      if (err3) throw err3;

      alert('PO ulang berhasil dibuat dengan no. PO: ' + noPoBaru);
      await loadAllData();
    } catch (err) {
      alert('Gagal membuat PO ulang: ' + err.message);
    }
  }

  // ============================================================
  //  FUNGSI LAINNYA (updateStatus, openForm, submitForm, upload, dll)
  // ============================================================
  async function updateStatus(id, status) {
    try {
      const { error } = await window.supabase.from('pembelian').update({ status }).eq('id', id);
      if (error) throw error;
      await loadAllData();
    } catch (err) { alert('Gagal: ' + err.message); }
  }

  function openForm() { /* ... */ }
  function closeForm() { /* ... */ }
  async function submitForm() { /* ... */ }

  // Upload CSV (sama seperti sebelumnya)
  function openUploadModal() { /* ... */ }
  function closeUploadModal() { /* ... */ }
  function handleUploadFile(evt) { /* ... */ }
  function processUploadRows(rawRows) { /* ... */ }
  function renderUploadPreview() { /* ... */ }
  function downloadBarisBermasalah() { /* ... */ }
  async function confirmUpload() { /* ... */ }

  function escapeHtml(str) { return String(str).replace(/[&<>"']/g, s => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[s])); }
</script>
</body>
</html>
